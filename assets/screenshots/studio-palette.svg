<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640">
  <defs>
    <filter id="win-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="640" fill="#11111b" rx="14" />

  <!-- Libadwaita Preferences Window -->
  <g transform="translate(40, 30)" filter="url(#win-shadow)">
    <!-- Window Frame -->
    <rect width="800" height="580" rx="16" fill="#1e1e2e" stroke="#313244" stroke-width="1.5" />

    <!-- Headerbar -->
    <rect width="800" height="50" rx="16" fill="#181825" />
    <rect y="30" width="800" height="20" fill="#181825" />
    <line x1="0" y1="50" x2="800" y2="50" stroke="#313244" stroke-width="1" />

    <!-- Window Controls (Traffic Lights on Left or Right) -->
    <circle cx="28" cy="25" r="6" fill="#f38ba8" />
    <circle cx="48" cy="25" r="6" fill="#f9e2af" />
    <circle cx="68" cy="25" r="6" fill="#a6e3a1" />

    <text x="400" y="31" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Studio de Personalización — Libadwaita GTK4</text>

    <!-- Navigation Tabs / View Switcher -->
    <g transform="translate(240, 62)">
      <rect width="320" height="34" rx="17" fill="#181825" stroke="#313244" stroke-width="1" />
      <text x="40" y="22" fill="#a6adc8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="12" font-weight="600">Catálogo</text>
      
      <!-- Active Tab: Studio -->
      <rect x="95" y="3" width="130" height="28" rx="14" fill="#313244" />
      <text x="160" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🎨 Studio Paleta</text>
      
      <text x="268" y="22" fill="#a6adc8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="12" font-weight="600">Métricas</text>
    </g>

    <!-- Main Form Content -->
    <!-- Group: Plantilla y Nombre -->
    <g transform="translate(60, 115)">
      <text x="0" y="16" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="13" font-weight="700">PLANTILLA Y NOMBRE</text>

      <!-- Row: Plantilla Base -->
      <g transform="translate(0, 26)">
        <rect width="680" height="46" rx="10" fill="#24273a" stroke="#363a4f" stroke-width="1" />
        <text x="16" y="28" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="13" font-weight="600">Cargar plantilla base</text>
        <rect x="490" y="8" width="174" height="30" rx="6" fill="#313244" />
        <text x="502" y="28" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="12">Catppuccin Mocha ▾</text>
      </g>
    </g>

    <!-- Group: Selectores de Color Intuitivos -->
    <g transform="translate(60, 210)">
      <text x="0" y="16" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="13" font-weight="700">COLORES DE LA PALETA (Gtk.ColorDialogButton)</text>
      
      <!-- Color Row 1: Acento Principal -->
      <g transform="translate(0, 26)">
        <rect width="680" height="46" rx="10" fill="#24273a" stroke="#363a4f" stroke-width="1" />
        <text x="16" y="28" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="13" font-weight="600">Color de Acento Principal</text>
        <!-- Hex entry -->
        <rect x="520" y="8" width="80" height="30" rx="6" fill="#181825" stroke="#45475a" stroke-width="1" />
        <text x="532" y="28" fill="#a6adc8" font-family="monospace" font-size="12">#cba6f7</text>
        <!-- Color Dialog Button -->
        <circle cx="635" cy="23" r="13" fill="#cba6f7" stroke="#ffffff" stroke-width="2" />
      </g>

      <!-- Color Row 2: Fondo de Ventana -->
      <g transform="translate(0, 78)">
        <rect width="680" height="46" rx="10" fill="#24273a" stroke="#363a4f" stroke-width="1" />
        <text x="16" y="28" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="13" font-weight="600">Fondo de Ventana (Window BG)</text>
        <rect x="520" y="8" width="80" height="30" rx="6" fill="#181825" stroke="#45475a" stroke-width="1" />
        <text x="532" y="28" fill="#a6adc8" font-family="monospace" font-size="12">#1e1e2e</text>
        <circle cx="635" cy="23" r="13" fill="#1e1e2e" stroke="#45475a" stroke-width="2" />
      </g>

      <!-- Color Row 3: Barra Lateral -->
      <g transform="translate(0, 130)">
        <rect width="680" height="46" rx="10" fill="#24273a" stroke="#363a4f" stroke-width="1" />
        <text x="16" y="28" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="13" font-weight="600">Barra Lateral (Sidebar Nautilus)</text>
        <rect x="520" y="8" width="80" height="30" rx="6" fill="#181825" stroke="#45475a" stroke-width="1" />
        <text x="532" y="28" fill="#a6adc8" font-family="monospace" font-size="12">#181825</text>
        <circle cx="635" cy="23" r="13" fill="#181825" stroke="#45475a" stroke-width="2" />
      </g>
    </g>

    <!-- Group: Geometría y Botones -->
    <g transform="translate(60, 410)">
      <text x="0" y="16" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="13" font-weight="700">VENTANAS, BORDES Y BOTONES</text>

      <!-- Metric: Disposición de botones -->
      <g transform="translate(0, 26)">
        <rect width="680" height="46" rx="10" fill="#24273a" stroke="#363a4f" stroke-width="1" />
        <text x="16" y="28" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="13" font-weight="600">Disposición de botones de ventana</text>
        <rect x="420" y="8" width="244" height="30" rx="6" fill="#313244" />
        <text x="432" y="28" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="12">Izquierda (macOS Style) ▾</text>
      </g>
    </g>

    <!-- Bottom Action Bar -->
    <g transform="translate(60, 505)">
      <rect width="180" height="44" rx="22" fill="#313244" stroke="#45475a" stroke-width="1" />
      <text x="90" y="27" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Guardar Preset</text>

      <rect x="460" width="220" height="44" rx="22" fill="#cba6f7" />
      <text x="570" y="27" fill="#11111b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="13" font-weight="700" text-anchor="middle">🚀 Guardar y Aplicar</text>
    </g>
  </g>
</svg>
