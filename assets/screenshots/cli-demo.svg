<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500">
  <defs>
    <filter id="term-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="880" height="500" fill="#11111b" rx="14" />

  <!-- Terminal Window Frame -->
  <g transform="translate(40, 25)" filter="url(#term-shadow)">
    <rect width="800" height="450" rx="14" fill="#181825" stroke="#313244" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect width="800" height="38" rx="14" fill="#11111b" />
    <rect y="20" width="800" height="18" fill="#11111b" />
    <circle cx="24" cy="19" r="6" fill="#f38ba8" />
    <circle cx="44" cy="19" r="6" fill="#f9e2af" />
    <circle cx="64" cy="19" r="6" fill="#a6e3a1" />
    <text x="400" y="24" fill="#6c7086" font-family="monospace" font-size="12" text-anchor="middle">terminal — ./quick-themer info "Catppuccin Mocha"</text>

    <!-- Terminal Output -->
    <g transform="translate(30, 65)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13">
      <!-- Prompt 1 -->
      <text y="0" fill="#a6e3a1">angelaguayo@gnome</text>
      <text x="145" y="0" fill="#6c7086">:</text>
      <text x="155" y="0" fill="#89b4fa">~/gnome-quick-themer</text>
      <text x="315" y="0" fill="#cdd6f4">$ ./quick-themer info "Catppuccin Mocha"</text>

      <text y="34" fill="#89dceb" font-weight="700">🎨 Preset: Catppuccin Mocha</text>
      <text x="235" y="34" fill="#a6e3a1">[Sistema]</text>

      <text y="62" fill="#cdd6f4">  • Esquema:          dark</text>
      
      <!-- Color line with ANSI swatches -->
      <text y="88" fill="#cdd6f4">  • Acento Primario:  </text>
      <rect x="180" y="74" width="20" height="16" rx="3" fill="#cba6f7" />
      <text x="210" y="88" fill="#cba6f7">#cba6f7</text>

      <text y="114" fill="#cdd6f4">  • Fondo Ventana:    </text>
      <rect x="180" y="100" width="20" height="16" rx="3" fill="#1e1e2e" stroke="#45475a" stroke-width="1" />
      <text x="210" y="114" fill="#a6adc8">#1e1e2e</text>

      <text y="140" fill="#cdd6f4">  • Barra Lateral:    </text>
      <rect x="180" y="126" width="20" height="16" rx="3" fill="#181825" stroke="#45475a" stroke-width="1" />
      <text x="210" y="140" fill="#a6adc8">#181825</text>

      <text y="166" fill="#cdd6f4">  • Radio Ventana:    14 px</text>
      <text y="192" fill="#cdd6f4">  • Radio Botones:    10 px</text>
      <text y="218" fill="#cdd6f4">  • Ancho de Borde:   1 px</text>
      <text y="244" fill="#cdd6f4">  • Disposición:      left (macOS style)</text>
      <text y="270" fill="#cdd6f4">  • Estilo Controles: traffic-hover</text>
      <text y="296" fill="#cdd6f4">  • Fondo SVG:        aurora</text>

      <!-- Prompt 2 -->
      <text y="335" fill="#a6e3a1">angelaguayo@gnome</text>
      <text x="145" y="335" fill="#6c7086">:</text>
      <text x="155" y="335" fill="#89b4fa">~/gnome-quick-themer</text>
      <text x="315" y="335" fill="#cdd6f4">$ ./quick-themer apply "Catppuccin Mocha"</text>
      <text y="358" fill="#a6e3a1">✅ Compilado en 280.4 ms con sassc.</text>
      <text y="378" fill="#f9e2af">🎉 ¡Tema 'Catppuccin Mocha' aplicado con éxito a GNOME Shell y Libadwaita!</text>
    </g>
  </g>
</svg>
