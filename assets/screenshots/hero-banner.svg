<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181926" />
      <stop offset="50%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a7c080" />
      <stop offset="25%" stop-color="#cba6f7" />
      <stop offset="50%" stop-color="#7aa2f7" />
      <stop offset="75%" stop-color="#fe8019" />
      <stop offset="100%" stop-color="#88c0d0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)" rx="16" />
  
  <!-- Subtle Grid Accent -->
  <g opacity="0.06" stroke="#cdd6f4" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Title Badge -->
  <rect x="80" y="70" width="190" height="34" rx="17" fill="#313244" opacity="0.8" />
  <circle cx="102" cy="87" r="6" fill="#a7c080" />
  <text x="120" y="93" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="14" font-weight="600" letter-spacing="1">GNOME 45–51+</text>

  <!-- Main Headline -->
  <text x="80" y="170" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">GNOME Quick Themer</text>

  <!-- Subtitle -->
  <text x="80" y="220" fill="#a6adc8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="20" font-weight="400">
    Personalización nativa en 1 clic para Quick Settings y Studio Libadwaita en GTK4
  </text>

  <!-- Palette Swatches Strip -->
  <g transform="translate(80, 260)">
    <rect width="64" height="24" rx="12" fill="#a7c080" />
    <rect x="74" width="64" height="24" rx="12" fill="#cba6f7" />
    <rect x="148" width="64" height="24" rx="12" fill="#7aa2f7" />
    <rect x="222" width="64" height="24" rx="12" fill="#fe8019" />
    <rect x="296" width="64" height="24" rx="12" fill="#88c0d0" />
    <rect x="370" width="64" height="24" rx="12" fill="#bd93f9" />
    <rect x="444" width="64" height="24" rx="12" fill="#ebbcba" />
    <text x="525" y="17" fill="#6c7086" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="14" font-weight="500">+ 26 Paletas Calibradas</text>
  </g>

  <!-- Feature Highlights Pills -->
  <g transform="translate(80, 325)">
    <rect width="180" height="36" rx="18" fill="#181825" stroke="#313244" stroke-width="1.5" />
    <text x="20" y="23" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="13" font-weight="600">⚡ 1-Clic Quick Settings</text>

    <rect x="195" width="200" height="36" rx="18" fill="#181825" stroke="#313244" stroke-width="1.5" />
    <text x="215" y="23" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="13" font-weight="600">🎨 Libadwaita Studio GTK4</text>

    <rect x="410" width="180" height="36" rx="18" fill="#181825" stroke="#313244" stroke-width="1.5" />
    <text x="430" y="23" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="13" font-weight="600">🖼️ Wallpapers 4K SVG</text>

    <rect x="605" width="180" height="36" rx="18" fill="#181825" stroke="#313244" stroke-width="1.5" />
    <text x="625" y="23" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="13" font-weight="600">🦊 Sincronización Firefox</text>
  </g>

  <!-- Window Mockup Silhouette on the Right -->
  <g transform="translate(860, 60)" filter="url(#shadow)">
    <rect width="280" height="300" rx="16" fill="#1e1e2e" stroke="#313244" stroke-width="1.5" />
    <!-- Headerbar -->
    <rect width="280" height="42" rx="16" fill="#181825" />
    <rect y="26" width="280" height="16" fill="#181825" />
    <!-- Traffic lights -->
    <circle cx="24" cy="21" r="5.5" fill="#f38ba8" />
    <circle cx="42" cy="21" r="5.5" fill="#f9e2af" />
    <circle cx="60" cy="21" r="5.5" fill="#a6e3a1" />
    <text x="140" y="26" fill="#9399b2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Studio Preview</text>
    <!-- Content Mockup -->
    <rect x="18" y="60" width="244" height="40" rx="8" fill="#313244" opacity="0.6" />
    <circle cx="38" cy="80" r="10" fill="#a7c080" />
    <rect x="60" y="73" width="90" height="14" rx="4" fill="#cdd6f4" />
    
    <rect x="18" y="115" width="244" height="40" rx="8" fill="#313244" opacity="0.6" />
    <circle cx="38" cy="135" r="10" fill="#cba6f7" />
    <rect x="60" y="128" width="110" height="14" rx="4" fill="#cdd6f4" />

    <rect x="18" y="170" width="244" height="40" rx="8" fill="#313244" opacity="0.6" />
    <circle cx="38" cy="190" r="10" fill="#7aa2f7" />
    <rect x="60" y="183" width="80" height="14" rx="4" fill="#cdd6f4" />

    <!-- Button -->
    <rect x="18" y="235" width="244" height="38" rx="19" fill="#a7c080" />
    <text x="140" y="259" fill="#11111b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Aplicar Tema</text>
  </g>
</svg>
